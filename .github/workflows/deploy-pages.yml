# Publishes a static (prerendered) build to GitHub Pages:
#   https://<owner>.github.io/nishok-greens/
# The Cloudflare Worker build (`bun run build`) is unaffected.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build static site
        run: bunx vite build
        env:
          GITHUB_PAGES: "1"
          PAGES_BASE: /${{ github.event.repository.name }}/
      - name: Prepare Pages files
        run: |
          touch dist/client/.nojekyll
          cp dist/client/index.html dist/client/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
